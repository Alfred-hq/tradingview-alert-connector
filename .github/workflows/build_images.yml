name: Build and Push Docker Image

on:
  push:
    branches:
      - master-production
    #   - pre-production


env:
  REGISTRY: ghcr.io         
jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      packages: 'write'
      id-token: 'write'
    steps:
      - name: Derive latest image name
        id: branch-name
        run: |
          name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')
          echo "BRANCH_NAME=$name" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses:  docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALFRED_FLOW_DOCKER_USERNAME }}
          password: ${{ secrets.ALFRED_FLOW_DOCKER_PASSWORD }}

      - name: Get commit hash
        id: get_commit_hash
        run: echo "::set-output name=hash::$(git rev-parse --short HEAD)"

      - name: Build and Push Image
        run: |
          branch_name="${{steps.branch-name.outputs.BRANCH_NAME}}"
          cd ./
          docker build -t ${{ env.REGISTRY }}/alfred-hq/dydx-proxy-${branch_name}:${{ steps.get_commit_hash.outputs.hash }} -t ${{ env.REGISTRY }}/alfred-hq/dydx-proxy-${branch_name}:latest -f Dockerfile .  || exit 1
          docker push ${{ env.REGISTRY }}/alfred-hq/dydx-proxy-${branch_name}:${{ steps.get_commit_hash.outputs.hash }} || exit 1
          docker push ${{ env.REGISTRY }}/alfred-hq/dydx-proxy-${branch_name}:latest || exit 1

          
